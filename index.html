<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu"><h1>BLOCK WORLD</h1><p>Build your own adventure!</p><button id="playButton">PLAY GAME</button><p class="hint">WASD to move · Mouse to look</p></div>
<div id="hud"><div id="crosshair">+</div><div id="instructions">WASD: Move · Space: Jump<br>Left click: Break block<br>Right click: Place block<br>ESC: Unlock mouse</div><div id="hotbar"><button data-block="grass">🌿</button><button data-block="dirt">🟫</button><button data-block="stone">⬜</button><button data-block="wood">🪵</button></div></div>
<div id="errorMessage"></div>
<script type="module" src="script.js"></script>
</body></html>
